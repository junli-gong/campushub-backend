name: campushub-lab3
services:
  mongodb:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 2s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      [
        'mongosh',
        'mongodb://mongodb:27017/admin?directConnection=true',
        '--quiet',
        '--eval',
      ]
    command:
      - >-
        try { rs.status(); } catch (error) {
          if (error.codeName !== 'NotYetInitialized') throw error;
          rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]});
        }
        let ready = false;
        for (let attempt = 0; attempt < 60; attempt++) {
          if (db.hello().isWritablePrimary) { ready = true; break; }
          sleep(1000);
        }
        if (!ready) throw new Error('Replica set did not elect a primary');
volumes:
  mongo-data:
